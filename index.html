      name="description"
      content="Voćnjak kod Loznice: atrakcije, 20 minuta pešice do Tršića, interaktivna 3D mapa sa mestima iz sela, istorija i FK Luk — rezultati, raspored i tabela."
    />
    <meta name="theme-color" content="#0e3320" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf6e9" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('vocnjak-theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        var l = localStorage.getItem('vocnjak-lang');
        if (l === 'cyr') document.documentElement.lang = 'sr-Cyrl';
        if (l === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>

  </body>
</html>
